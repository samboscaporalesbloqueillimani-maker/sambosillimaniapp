      <rect x="42" y="70" width="7" height="7"/>
      <rect x="42" y="84" width="7" height="7"/>
      <rect x="42" y="98" width="7" height="7"/>
      <rect x="42" y="112" width="7" height="7"/>
      <rect x="42" y="126" width="7" height="7"/>
      <rect x="42" y="140" width="7" height="7"/>
      <rect x="42" y="154" width="7" height="7"/>
      <rect x="42" y="168" width="7" height="7"/>
