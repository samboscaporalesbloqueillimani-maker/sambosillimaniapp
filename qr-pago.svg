  <text x="160" y="44" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SAMBOS CAPORALES BLOQUE ILLIMANI</text>

  <!-- Gold Divider -->
  <rect x="0" y="54" width="320" height="3" fill="#FFD700"/>

