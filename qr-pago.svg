  <text x="160" y="339" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#002F6C" text-anchor="middle">CUENTA OFICIAL TESORERÍA (BOB)</text>
  <text x="160" y="354" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Escanee desde cualquier banca móvil autorizada</text>
