    <text x="115" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#DA291C" text-anchor="middle">QR</text>
    <text x="115" y="127" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#002F6C" text-anchor="middle">SIMPLE</text>
